<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .pink{fill:none;stroke:#ff2f7d;stroke-width:2;vector-effect:non-scaling-stroke}
      .purple{fill:none;stroke:#8b5cf6;stroke-width:2;vector-effect:non-scaling-stroke}
      .fine{fill:none;stroke:#8b5cf6;stroke-width:1.2;opacity:.72;vector-effect:non-scaling-stroke}
      .dotp{fill:#ff2f7d}
      .dotu{fill:#8b5cf6}
    </style>
  </defs>

  <!-- outer construction circles -->
  <circle class="purple" cx="400" cy="400" r="325"/>
  <circle class="fine" cx="400" cy="400" r="292"/>
  <circle class="pink" cx="400" cy="400" r="258" opacity=".42"/>
  <circle class="fine" cx="400" cy="400" r="225" opacity=".55"/>

  <!-- outer radial ticks -->
  <g class="fine" opacity=".8">
    <path d="M400 58v-25M400 742v25M58 400H33M742 400h25"/>
    <path d="M158 158l-18-18M642 642l18 18M642 158l18-18M158 642l-18 18"/>
  </g>

  <!-- six-sided engineering frame -->
  <polygon class="purple" points="400,165 603,282 603,518 400,635 197,518 197,282" opacity=".72"/>
  <polygon class="fine" points="400,225 555,315 555,485 400,575 245,485 245,315" opacity=".7"/>

  <!-- atom-like mandala petals: exact vector paths, no font glyphs -->
  <g class="pink">
    <ellipse cx="400" cy="400" rx="210" ry="92" transform="rotate(0 400 400)"/>
    <ellipse cx="400" cy="400" rx="210" ry="92" transform="rotate(60 400 400)"/>
    <ellipse cx="400" cy="400" rx="210" ry="92" transform="rotate(120 400 400)"/>
  </g>

  <!-- inner petals -->
  <g class="purple" opacity=".78">
    <ellipse cx="400" cy="400" rx="145" ry="64" transform="rotate(30 400 400)"/>
    <ellipse cx="400" cy="400" rx="145" ry="64" transform="rotate(90 400 400)"/>
    <ellipse cx="400" cy="400" rx="145" ry="64" transform="rotate(150 400 400)"/>
  </g>

  <!-- central rings -->
  <circle class="pink" cx="400" cy="400" r="62"/>
  <circle class="purple" cx="400" cy="400" r="31"/>
  <circle class="dotp" cx="400" cy="400" r="9"/>

  <!-- outer dots -->
  <g>
    <circle class="dotp" cx="400" cy="142" r="4"/>
    <circle class="dotp" cx="529" cy="176" r="4"/>
    <circle class="dotp" cx="624" cy="271" r="4"/>
    <circle class="dotp" cx="658" cy="400" r="4"/>
    <circle class="dotp" cx="624" cy="529" r="4"/>
    <circle class="dotp" cx="529" cy="624" r="4"/>
    <circle class="dotp" cx="400" cy="658" r="4"/>
    <circle class="dotp" cx="271" cy="624" r="4"/>
    <circle class="dotp" cx="176" cy="529" r="4"/>
    <circle class="dotp" cx="142" cy="400" r="4"/>
    <circle class="dotp" cx="176" cy="271" r="4"/>
    <circle class="dotp" cx="271" cy="176" r="4"/>
  </g>

  <!-- small geometric chevrons around perimeter -->
  <g class="fine">
    <path d="M400 82l-17 27 17 27 17-27z"/>
    <path d="M718 400l-27-17-27 17 27 17z"/>
    <path d="M400 718l-17-27 17-27 17 27z"/>
    <path d="M82 400l27-17 27 17-27 17z"/>
  </g>
</svg>
